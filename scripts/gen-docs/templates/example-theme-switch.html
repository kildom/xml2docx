<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark / Light Mode</title>

  <style>
    /* Default mode is automatic */
    :root {
      --background: #ffffff;
      --text: #222222;
      --button-bg: #eeeeee;
      --button-text: #222222;
      --button-hover: #dddddd;
      --active-bg: #ffffff;
      --active-shadow: rgba(0, 0, 0, 0.18);
    }

    /* Automatic mode when the operating system uses dark mode */
    @media (prefers-color-scheme: dark) {
      .auto-mode {
        --background: #222222;
        --text: #ffffff;
        --button-bg: #444444;
        --button-text: #ffffff;
        --button-hover: #555555;
        --active-bg: #666666;
        --active-shadow: rgba(0, 0, 0, 0.4);
      }
    }

    /* Explicit dark mode */
    .dark-mode {
      --background: #222222;
      --text: #ffffff;
      --button-bg: #444444;
      --button-text: #ffffff;
      --button-hover: #555555;
      --active-bg: #666666;
      --active-shadow: rgba(0, 0, 0, 0.4);
    }

    /* Explicit light mode */
    .light-mode {
      --background: #ffffff;
      --text: #222222;
      --button-bg: #eeeeee;
      --button-text: #222222;
      --button-hover: #dddddd;
      --active-bg: #ffffff;
      --active-shadow: rgba(0, 0, 0, 0.18);
    }

    body {
      margin: 0;
      padding: 40px;

      font-family: Arial, sans-serif;

      background: var(--background);
      color: var(--text);

      transition:
        background 0.2s,
        color 0.2s;
    }

    /*
     * Theme selector
     *
     * Normally only the current theme is visible.
     * Hovering over the selector reveals all three options.
     */
    .theme-selector {
      position: relative;

      display: inline-flex;
      flex-direction: column;
      align-items: center;

      padding: 4px;
      margin-bottom: 24px;

      border-radius: 999px;

      background: var(--button-bg);
      color: var(--button-text);

      box-shadow:
        inset 0 0 0 1px rgba(128, 128, 128, 0.15);

      transition:
        border-radius 0.2s,
        box-shadow 0.2s;
    }

    /*
     * Round the selector into a vertical pill
     * while it is expanded.
     */
    .theme-selector:hover {
      border-radius: 20px;
    }

    /*
     * Theme buttons
     */
    .theme-option {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      padding: 0;
      margin: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: inherit;

      cursor: pointer;

      transition:
        background 0.2s,
        box-shadow 0.2s,
        transform 0.15s;
    }

    .theme-option:hover {
      background: var(--button-hover);
    }

    .theme-option:active {
      transform: scale(0.92);
    }

    /*
     * Highlight the currently selected theme.
     */
    .theme-option.active {
      background: var(--active-bg);
      box-shadow: 0 1px 4px var(--active-shadow);
    }

    .theme-option:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .theme-option svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    /*
     * When collapsed, only the current theme is visible.
     */
    .theme-option:not(.active) {
      display: none;
    }

    /*
     * When hovered, reveal the other theme options.
     */
    .theme-selector:hover .theme-option:not(.active) {
      display: flex;
      margin-top: 4px;
    }

    /*
     * Light / dark images
     */
    .dark-mode .only-light-mode,
    .auto-mode .only-light-mode {
      display: none;
    }

    .light-mode .only-dark-mode,
    .auto-mode .only-dark-mode {
      display: none;
    }

    /*
     * Automatic mode follows the operating system.
     */
    @media (prefers-color-scheme: dark) {
      .auto-mode .only-light-mode {
        display: none;
      }

      .auto-mode .only-dark-mode {
        display: block;
      }
    }

    @media (prefers-color-scheme: light) {
      .auto-mode .only-light-mode {
        display: block;
      }

      .auto-mode .only-dark-mode {
        display: none;
      }
    }

    img, object {
      max-width: 100%;
    }
  </style>

</head>

<body class="auto-mode">

  <!-- Theme selector -->

  <div
    class="theme-selector"
    role="group"
    aria-label="Color theme"
  >


<!-- Automatic -->
<button
  class="theme-option active"
  data-mode="auto-mode"
  aria-label="Automatic theme"
  aria-pressed="true"
  title="Automatic"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    aria-hidden="true"
  >
    <!-- Monitor -->
    <rect
      x="3"
      y="4"
      width="18"
      height="13"
      rx="2"
      stroke="currentColor"
      stroke-width="1.8"
    />

    <!-- Monitor stand -->
    <path
      d="M9 21 H15 M12 17 V21"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Sun -->
    <circle
      cx="9"
      cy="10"
      r="2.5"
      stroke="currentColor"
      stroke-width="1.4"
    />

    <!-- Moon -->
    <path
      d="M16.5 13 A3.5 3.5 0 0 1 13.5 7.5 A4 4 0 1 0 16.5 13 Z"
      fill="currentColor"
    />
  </svg>
</button>

<!-- Light -->
<button
  class="theme-option"
  data-mode="light-mode"
  aria-label="Light theme"
  aria-pressed="false"
  title="Light"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    aria-hidden="true"
  >
    <circle
      cx="12"
      cy="12"
      r="4"
      fill="currentColor"
    />

    <path
      d="
        M12 2
        V4
        M12 20
        V22
        M2 12
        H4
        M20 12
        H22
        M4.93 4.93
        L6.34 6.34
        M17.66 17.66
        L19.07 19.07
        M19.07 4.93
        L17.66 6.34
        M6.34 17.66
        L4.93 19.07
      "
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
</button>

<!-- Dark -->
<button
  class="theme-option"
  data-mode="dark-mode"
  aria-label="Dark theme"
  aria-pressed="false"
  title="Dark"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    aria-hidden="true"
  >
    <path
      d="
        M20.5 15.2
        A8.5 8.5 0 0 1 8.8 3.5
        A9 9 0 1 0 20.5 15.2
        Z
      "
      fill="currentColor"
    />
  </svg>
</button>


  </div>


  <p>
    This page supports light, dark, and automatic modes.
  </p>

  <div>
    <img
      class="only-light-mode"
      src="dist/html/graph-light.svg"
      alt="Image shown in light mode"
    >


<img
  class="only-dark-mode"
  src="dist/html/graph-dark.svg"
  alt="Image shown in dark mode"
>

<object class="only-light-mode" data="dist/html/graph-light.svg" type="image/svg+xml"></object>
<object class="only-dark-mode" data="dist/html/graph-dark.svg" type="image/svg+xml"></object>


  </div>

  <script>
    const themeOptions = document.querySelectorAll(".theme-option");

    /*
     * Restore the user's previous choice.
     * If there is no saved choice, use automatic mode.
     */
    const savedMode = localStorage.getItem("theme-mode");

    if (
      savedMode === "light-mode" ||
      savedMode === "dark-mode" ||
      savedMode === "auto-mode"
    ) {
      setMode(savedMode);
    } else {
      setMode("auto-mode");
    }

    /*
     * Change the current theme and save it.
     */
    function setMode(mode) {
      document.body.className = mode;

      localStorage.setItem("theme-mode", mode);

      themeOptions.forEach(function (option) {
        const isActive = option.dataset.mode === mode;

        option.classList.toggle("active", isActive);
        option.setAttribute("aria-pressed", isActive);
      });
    }

    /*
     * Select a theme when its button is clicked.
     *
     * The panel itself is expanded/collapsed entirely
     * through CSS :hover.
     */
    themeOptions.forEach(function (option) {
      option.addEventListener("click", function () {
        setMode(option.dataset.mode);
      });
    });
  </script>

</body>
</html>
