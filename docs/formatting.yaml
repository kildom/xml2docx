
- tag-name: font
  children: [ -formatting-tags-, -leaf-tags- ]
  brief: Change text style.
  details: |
    This tag is used to change text style.
    It can be used to change font, size, color, and other text attributes.
  combine: [ -formatting-attributes- ]

- tag-name: b
  alias-of: font
  alias-text: '`<font bold="true"`'
  brief: Bold text.
  examples:
    - brief: Simple
      code: <b>Hello, world!</b>

- tag-name: i
  alias-of: font
  alias-text: '`<font italics="true"`'
  brief: Italic text.

- tag-name: u
  alias-of: font
  alias-text: '`<font underline="single"`'
  brief: Underline text.

- tag-name: s
  alias-of: font
  alias-text: '`<font strike="true"`'
  brief: Line through text.

- tag-name: span
  alias-of: font
  alias-text: '`<font>`'
  brief: Text span.
  details: |
    You can use it for enclosing some text.

- tag-name: sub
  alias-of: font
  alias-text: '`<font subscript="true"`'
  brief: Subscript.

- tag-name: sup
  alias-of: font
  alias-text: '`<font superscript="true"`'
  brief: Superscript.

- tag-name: -formatting-attributes-
  attributes:
    bold:
      type: bool
      brief: Bold text.
    italics:
      type: bool
      brief: Italic text.
    underline:
      value: type [color](attributes.html#color)
      brief: Underline text.
      details: |
        - **type** @optional - The underline type. Default is `single`.
          The `type` accepts [boolean](#boolean) values to enable or disable the `single` underline type
          or one of the following values:

          <# enumerator('docx.UnderlineType', {
            indent: 2,
            collapse: '`single`, `none`, `double`, `dotted`, `dash`, `wave`, and more...',
          }) #>
        - **color** @optional - The underline color. Default is the same as the text color.
    strike:
      type: bool
      brief: Strike through text.


- tag-name: vwnbsp
  brief: Variable width non-breaking space.
  details: |
    This tag adds "zero width no-break space" and "normal space" characters which
    is a workaround to achieve "variable width no-break space" in docx.
    This is useful for justified text where normal non-breaking spaces are not stretched to fill the line.

    This workaround works with a desktop Word application.
    It will not work in browsers and probably in other applications.

- tag-name: page-number
  brief: Show page number.
  details: Allowed only inside `<footer>` or `<header>`.

- tag-name: total-pages
  brief: Show total number of pages.
  details: Allowed only inside `<footer>` or `<header>`.


- tag-name: CDATA
  brief: CDATA node containing text.
  custom-page: |
    # CDATA

    This is node containing text.
    You can use it if your text may contain special characters, for example:

    ```
    <![CDATA[
      The <br> HTML element produces a line break.
    ]]>
    ```

- tag-name: TEXT
  brief: Text node.
  custom-page: |
    # TEXT

    This is simple node containing text, for example:

    ```
    Hello, World!
    ```

    If your text contains special characters, you need to use XML entity references:

    Character | Entity reference
    --------- | ----------------
    non-breaking space | `&nbsp;`
    `<`       | `&lt;`
    `>`       | `&gt;`
    `&`       | `&amp;`
    `"`       | `&quot;`
    `'`       | `&apos;`

    If the number of entities is high, you should consider using `<CDATA>` node instead of TEXT node.
    
  examples:
    - brief: Simple
      details: The TEXT node is used directly inside `<document>` element.
      code: |
        <document>
          Hello,&euro;World!
        </document>