- tag-name: document
  brief: Root element of the source document.
  details: |
    The `document` element is the root of the source file and represents the entire
    generated document.

  children: [ section, header, footer, p-style, font-style, group-style, table, p, embedded-font, p-aliases ]
  implicit: p

  attributes:
    styles:
      type: file
      brief: Load styles from an external DOCX file.
      details: |
        Styles are imported from the specified DOCX file and become available
        within the document.

        This allows you to design styles in editor and reuse them in
        generated documents.

        In the external file, except defining a styles, you should also write
        some text and use defined styles. This is to make sure the styles
        are actually included in the file, not only implicitly shown by the editor.

    background:
      type: color
      brief: Page background color.

    title:
      type: str
      brief: Document title stored in document properties.

    subject:
      type: str
      brief: Document subject and comments stored in document properties.

    creator:
      type: str
      brief: Name of the document creator stored in document properties.

    keywords:
      type: str
      brief: Comma-separated keywords stored in document properties.

    description:
      type: str
      brief: Document description stored in document properties.

    last-modified-by:
      type: str
      brief: Name of the last person who modified the document.

    custom-properties:
      value: name=value, name=value, ...
      brief: Custom document properties.
      details: |
        Defines custom document properties as comma-separated name-value pairs.

        Commas inside names or values must be escaped with a backslash (`\`).
        A literal backslash can be escaped with another backslash, but is is not
        required if it is not followed by a comma or another backslash.

        Examples of valid strings:
        * `Coauthors=John Smith\, Jane Smith`
        * `Source=C:\\My Files\\source.txt`
        * `Source=C:\My Files\source.txt`

    revision:
      type: int
      brief: Document revision number.
