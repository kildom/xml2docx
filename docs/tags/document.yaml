- tag-name: document
  brief: Root document element.
  children: [ section, header, footer, p-style, font-style, table, p, embedded-font ]
  implicit: p
  attributes:
    styles:
      type: file
      brief: External styles.
      details: |
        Styles will be loaded from the specified docx file.
        You can create a docx file and define styles there.
      TC: [Paragraph, Character, Missing]
    background:
      type: color
      brief: Background color of the document.
      TC: [Orange]
    title:
      type: str
      brief: Title in document properties.
      TC: [Exists, Missing]
    subject:
      type: str
      brief: Subject in document properties.
      TC: [Exists, Missing]
    creator:
      type: str
      brief: Creator name in document properties.
      TC: [Exists, Missing]
    keywords:
      type: str
      brief: Keywords in document properties.
      TC: [Exists, Missing]
    description:
      type: str
      brief: Description in document properties.
      TC: [Exists, Missing]
    last-modified-by:
      type: str
      brief: Last modified by name in document properties.
      TC: [Exists, Missing]
    custom-properties:
      value: name=value, name=value, ...
      brief: Custom document properties.
      details: |
        They are comma-separated name-value pairs.
        If you want to use a comma in the name or value, you must escape it with a backslash.
        Use double backslashes to escape a backslash.
        For example: `Coauthors=John Doe\, Jane Smith` or `Source=C:\\My Files\\source.txt`
      TC: [None, One, Two, With escapes and multiple equals]
    revision:
      type: int
      brief: Revision number of the document.
      TC: [Revision]
