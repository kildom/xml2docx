- tag-name: p
  brief: Paragraph.
  children: [ font ]
  implicit: font
  details: |
    The heading tags `<title>`, `<h1>`, `<h2>`, `<h3>`, `<h4>`, `<h5>`, and `<h6>` are aliases of
    `<p>` tag with the `heading=""` attribute set to the corresponding heading level.

    You can use attributes passing to change text style of this paragraph since direct children are `<font>` tags,
    for example:
    ```
    <p font.color="red">Warning!</p>
    ```
    This is shorter version of the following:
    ```
    <p><font color="red">Warning!</font></p>
    ```

    For multiple paragraphs that share the same style, you should use the `style=""` attribute and `<p-style>` tag.
  combine: [ -IParagraphPropertiesOptions- ]
  examples:
    - title: Simple
      code: <p>Hello, world!</p>
    - title: Alignment
      code: <p align="justify">This is a justified paragraph. <% tools.loremIpsum(500, 952727959) %></p>
    - title: Font color
      code: <p font.color="red">Warning!</p>
  docx-js: https://docx.js.org/api/types/IParagraphOptions.html
  unused-docx-js:
    - children
    - text


- tag-name: h1
  alias-of: p
  brief: Heading level 1 paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="1"` attribute.

- tag-name: h2
  alias-of: p
  brief: Heading level 2 paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="2"` attribute.

- tag-name: h3
  alias-of: p
  brief: Heading level 3 paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="3"` attribute.

- tag-name: h4
  alias-of: p
  brief: Heading level 4 paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="4"` attribute.

- tag-name: h5
  alias-of: p
  brief: Heading level 5 paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="5"` attribute.

- tag-name: h6
  alias-of: p
  brief: Heading level 6 paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="6"` attribute.

- tag-name: title
  alias-of: p
  brief: Title paragraph.
  details: |
    This is an alias of the `<p>` tag with the `heading="title"` attribute.
