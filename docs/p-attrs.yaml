
- tag-name: -IParagraphPropertiesOptions-
  combine: [ -IParagraphStylePropertiesOptions- ]
  docx-js: docx.IParagraphPropertiesOptions
  attributes:
    page-break:
      type: bool
      brief: Page break before paragraph.
      docx-js: "pageBreakBefore?: boolean"
    heading:
      value: level
      brief: Heading level.
      details: |
        Possible values are `title` and numbers from `1` to `6`.

        You can use aliases `<h1>`, `<h2>`, `<h3>`, `<h4>`, `<h5>`, `<h6>`, and `<title>`.
    style:
      type: str
      brief: Paragraph style name.
      details: Defined by the `<p-style>` tag.
      docx-js: "style?: string"
    tabs:
      value: position type leader, ...
      brief: Tabulator stops.
      details: |
        - **position** @required - Tabulator stop position in [positive length](#positive-length).
        - **type** @optional - Tabulator stop type. Default is `left`.
            @enum TabStopType
        - **leader** @optional - Tabulator stop leader. Default is `none`.
            @enum LeaderType
      docx-js: "tabStops?: readonly TabStopDefinition[]"
    widow-control:
      type: bool
      brief: Paragraph widow control.
      docx-js: "widowControl?: boolean"
    word-wrap:
      type: bool
      brief: Word wrapping.
      docx-js: "wordWrap?: boolean"
    # Experimental attributes
    auto-space-east-asian-text:
      experimental: true
      type: bool
      docx-js: "autoSpaceEastAsianText?: boolean"
    bidirectional:
      experimental: true
      type: bool
      docx-js: "bidirectional?: boolean"
    bullet-level:
      experimental: true
      type: int
      docx-js: "bullet?: { level: number }"
    overflow-punctuation:
      experimental: true
      type: bool
      docx-js: "overflowPunctuation?: boolean"
    scale:
      experimental: true
      type: float
      docx-js: "scale?: number"
    suppress-line-numbers:
      experimental: true
      type: bool
      docx-js: "suppressLineNumbers?: boolean"
  unused-docx-js:
    - frame
    - run


- tag-name: -IParagraphStylePropertiesOptions-
  combine: [ -ILevelParagraphStylePropertiesOptions- ]
  attributes:
    border:
      type: border
      brief: Paragraph borders.
      docx-js: "border?: IBordersOptions"
    background:
      type: color
      brief: Paragraph background color.
      docx-js: "shading?: IShadingAttributesProperties"
  unused-docx-js:
    - numbering


- tag-name: -ILevelParagraphStylePropertiesOptions-
  attributes:
    align:
      value: alignment
      brief: Text alignment.
      details: |
        Supported values:
        <# enumerator('enums.AlignmentTypeAliases', {
            collapse: '`left`, `right`, `center`, `justify`, and more...',
          }) #>
      docx-js: "alignment?: typeof AlignmentType[keyof typeof AlignmentType]"
      examples:
        - brief: align="right"
          details: |
            This paragraph is right-aligned.
          code: |
            <p align="right">
              <# lorem({ length: 400, seed: 2412, wordWrap: 77, lineBreak: '\n  ' }) #>
            </p>
        - brief: align="justify"
          details: |
            This paragraph is justified.
          code: |
            <p align="justify">
              <# lorem({ length: 400, seed: 1234, wordWrap: 77, lineBreak: '\n  ' }) #>
            </p>
    indent:
      value: left right first-line
      brief: Paragraph indentation.
      details: |
        - **left** - Left indentation in [positive length](#positive-length) units.
          Zero by default. @required
        - **right** - Right indentation in [positive length](#positive-length) units.
          Zero by default. @optional
        - **first-line** - First line indentation in [length](#length) units.
          This is relative to the left indentation and it can be negative to create a hanging indent.
          Zero by default. @optional
    keep-lines:
      type: bool
      brief: Keep all lines on a single page if possible.
      docx-js: "keepLines?: boolean"
    keep-next:
      type: bool
      brief: Keep next paragraph on the same page if possible.
      docx-js: "keepNext?: boolean"
    outline:
      type: uint
      brief: Outline level.
      details: |
        Possible values are numbers from `1` to `9`.
        By default, paragraph is not in the document outline.
      docx-js: "outlineLevel?: number"
    spacing:
      value: before after
      brief: Paragraph spacing.
      details: |
        - **before** - Space before paragraph in [positive length](#positive-length) units. @required
        - **after** - Space after paragraph in [positive length](#positive-length) units. @optional
    line-spacing:
      value: requirement distance
      brief: Line spacing.
      details: |
        - **requirement** @optional - Defines spacing if line height is greater than the specified distance.
            - `exactly` - The line spacing is exactly the specified distance.
            - `at-least` - The line spacing is at least the specified distance (default).

        - **distance** @required - The distance between lines can be expressed in two ways:
            - Absolute value in [positive length](#positive-length) units, e.g. `1.5cm`.
            - Relative to line height, e.g. `1.25`.
      examples:
        - brief: line-spacing="1.75"
          details: |
            This paragraph has 1.75 space between lines which is 100% of line and 75%
            for empty space in between.
          code: |
            <p line-spacing="1.75">
              <# lorem({ length: 400, seed: 3281, wordWrap: 77, lineBreak: '\n  ' }) #>
            </p>
        - brief: line-spacing="exactly 3mm"
          details: |
            This paragraph has exactly 3mm space between lines.
          code: |
            <p line-spacing="exactly 3mm">
              <# lorem({ length: 400, seed: 1054, wordWrap: 77, lineBreak: '\n  ' }) #>
            </p>
      docx-js: "spacing?: ISpacingProperties"
    # Experimental attributes
    contextual-spacing:
      experimental: true
      type: bool
      docx-js: "contextualSpacing?: boolean"
    thematic-break:
      experimental: true
      type: bool
      docx-js: "thematicBreak?: boolean"
  unused-docx-js:
    - leftTabStop
    - rightTabStop


- enum-name: ParagraphAlignment
  combine: [ docx.AlignmentType ]
  values:
    justify: Alias of `both`.
