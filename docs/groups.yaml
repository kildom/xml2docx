
- group-name: -formatting-tags-
  tags:
    - font
    - b
    - i
    - s
    - u
    - sub
    - sup
    - span

- group-name: font-aliases
  brief: Font aliases
  tags:
    - b
    - i
    - s
    - u
    - sub
    - sup
    - span

- group-name: -leaf-tags-
  tags:
    - img
    - br
    - tab
    - space
    - page-number
    - total-pages
    - page-break
    - vwnbsp
    - TEXT
    - CDATA

- group-name: text-elements
  brief: Text elements
  tags:
    - TEXT
    - CDATA
    - br
    - tab
    - space
    - page-number
    - total-pages
    - page-break
    - vwnbsp

- group-name: p-aliases
  brief: Paragraph aliases
  tags:
    - h1
    - h2
    - h3
    - h4
    - h5
    - h6
    - title

